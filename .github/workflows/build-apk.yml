name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/src && cp -r lib pubspec.yaml /tmp/src/
          flutter create --platforms=android --project-name kidstube --org uz.kidstube .
          rm -rf lib pubspec.yaml test
          cp -r /tmp/src/lib . && cp /tmp/src/pubspec.yaml .

      - name: Patch Android config
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="kidstube"#android:label="Мультики"#' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true

      - run: flutter pub get

      - name: Build APK
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: flutter build apk --release --dart-define=YT_API_KEY=$YT_API_KEY --dart-define=CATALOG_URL=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/data/catalog.json

      - uses: actions/upload-artifact@v4
        with:
          name: kidstube-apk
          path: build/app/outputs/flutter-apk/app-release.apk
